<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2200" viewBox="0 0 1600 2200">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f3e9"/>
      <stop offset=".52" stop-color="#eee3d1"/>
      <stop offset="1" stop-color="#f7f0e4"/>
    </linearGradient>
    <radialGradient id="glow" cx=".18" cy=".15" r=".9">
      <stop offset="0" stop-color="#fffaf0" stop-opacity=".95"/>
      <stop offset="1" stop-color="#e6d6be" stop-opacity=".08"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="4" seed="12" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
