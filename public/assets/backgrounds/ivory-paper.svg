    </filter>
    <pattern id="fibers" width="180" height="26" patternUnits="userSpaceOnUse">
      <path d="M0 8h70M94 17h58M12 24h104" stroke="#9a7f5f" stroke-opacity=".09" stroke-width=".7"/>
    </pattern>
  </defs>
  <rect width="1600" height="2200" fill="url(#paper)"/>
  <rect width="1600" height="2200" fill="url(#glow)"/>
  <rect width="1600" height="2200" fill="url(#fibers)"/>
  <rect width="1600" height="2200" filter="url(#grain)" opacity=".55"/>
  <circle cx="1290" cy="380" r="310" fill="none" stroke="#9b4d3b" stroke-opacity=".06" stroke-width="2"/>
  <circle cx="1290" cy="380" r="250" fill="none" stroke="#9b4d3b" stroke-opacity=".045" stroke-width="1"/>
</svg>
